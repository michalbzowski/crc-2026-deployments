spring:
  application:
    name: crc-2026-deployments
  server:
    port: 8080

  # Database Configuration (used by both JPA and Flyway)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${SPRING_DATASOURCE_USERNAME:demo}
    password: ${SPRING_DATASOURCE_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration (Spring Boot 4.0.6)
  # Flyway will automatically use spring.datasource configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    org.flywaydb: INFO
    org.flywaydb.core: DEBUG

