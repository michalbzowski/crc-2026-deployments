version: "3.9"

services:
  linux1:
    build: .
    container_name: linux1
    ports:
      - "8081:8080"
    environment:
      INSTANCE_NAME: linux-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
    networks:
      - app-network

  linux2:
    build: .
    container_name: linux2
    ports:
      - "8082:8080"
    environment:
      INSTANCE_NAME: linux-2
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - linux1
      - linux2
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  pg-data:
